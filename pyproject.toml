[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace2quality"
version = "0.1.0"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "pytest-cov>=4.1.0", "pytest-mock>=3.12.0", "black>=23.12.0", "ruff>=0.1.0", "mypy>=1.7.0", "isort>=5.13.0", "pre-commit>=3.5.0"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
# testpaths = ["apps", "packages", "tests"]
# python_files = "test_*.py"
# asyncio_mode = "auto"
